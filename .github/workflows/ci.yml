name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WorkTodo.slnx

      - name: Build
        run: dotnet build WorkTodo.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test WorkTodo.slnx --configuration Release --no-build

  build-demo:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish demo
        run: dotnet publish src/WorkTodo.Demo --configuration Release --output publish

      - name: Prepare for GitHub Pages
        run: bash .github/scripts/prepare-pages.sh publish/wwwroot "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy-demo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
