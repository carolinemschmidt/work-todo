name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WorkTodo.slnx

      - name: Build
        run: dotnet build WorkTodo.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test WorkTodo.slnx --configuration Release --no-build
